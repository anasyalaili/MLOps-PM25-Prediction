global:
  scrape_interval: 5s
  evaluation_interval: 10s

scrape_configs:
  # Setiap replika model-api ditemukan lewat DNS Docker, termasuk yang
  # ditambahkan dengan --scale.
  - job_name: model-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [model-api]
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
