{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "pm25",
      "folder": "PM2.5",
      "interval": "10s",
      "rules": [
        {
          "uid": "pm25-latency",
          "title": "Latensi tinggi",
          "condition": "B",
          "for": "30s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "p95 latensi inferensi di atas 1 detik."
          },
          "labels": {
            "project": "pm25"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le) (rate(pm25_request_duration_seconds_bucket[1m])))",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "pm25-drift",
          "title": "Data drift PM2.5",
          "condition": "B",
          "for": "30s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "PSI input PM2.5 di atas 0,2 terhadap data training."
          },
          "labels": {
            "project": "pm25"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(pm25_drift_psi{feature=\"pm2_5\"})",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.2
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "pm25-replica",
          "title": "Replika model kurang",
          "condition": "B",
          "for": "30s",
          "noDataState": "Alerting",
          "execErrState": "Error",
          "annotations": {
            "summary": "Replika model-api yang sehat kurang dari 3."
          },
          "labels": {
            "project": "pm25"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(up{job=\"model-api\"}) or vector(0)",
                "instant": true
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        3
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
