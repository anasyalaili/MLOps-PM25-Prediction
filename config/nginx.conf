# Load balancer untuk replika model-api (round robin).
# Nama "model-api" ditanyakan ulang ke DNS Docker (resolve), sehingga replika
# yang ditambah atau dikurangi ikut dipakai tanpa memulai ulang Nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream model_api {
    zone model_api 64k;
    server model-api:8080 resolve;
}

log_format lb '$remote_addr "$request" $status -> $upstream_addr';

server {
    listen 80;
    access_log /var/log/nginx/access.log lb;

    location / {
        proxy_pass http://model_api;
        proxy_set_header Host $host;
        # Alamat replika yang menjawab, untuk bukti pembagian beban.
        add_header X-Upstream $upstream_addr always;
    }
}
